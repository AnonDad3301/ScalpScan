runtime:
  adapter: ccxt
  exchange: bybit
  market: perp
  testnet: false
  ws_stale_resub_ms: 3000
  ws_stale_reconnect_ms: 10000
  timeframe: 1m
  lookback: 300
  max_pairs: 50
  tick_interval_sec: 2.0
  tick_timeout_sec: 25.0
  price_interval_sec: 1.0
  price_timeout_sec: 1.0
  ws_host: 127.0.0.1
  ws_port: 8766
  monitoring_host: 127.0.0.1
  monitoring_port: 8081
  ccxt:
    options:
      defaultType: swap
      defaultSubType: linear
universe:
  mode: db
  custom_symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  quote:
  - USDT
  - USDC
  min_volume: 0
features:
  invariants:
    rsi_range:
    - 0
    - 100
    adx_range:
    - 0
    - 100
    atr_min: 1e-12
    forbid_nan: true
model:
  k: 35
  min_samples: 50
  min_auc: 0.52
  auc_warmup_samples: 600
  auc_override_confidence_min: 0.70
  forward: 4
  ensemble:
    w_a: 0.55
    w_b: 0.45
    gray_zone: [0.45, 0.55]
    platt:
      a3: 1.0
      b3: 0.0
      a5: 1.0
      b5: 0.0
gate:
  profile: scalp
  profiles:
    scalp:
      entry_threshold: 0.06
      confidence_min: 0.52
      adx_min: 8
      spread_max: 12.0
      volz_max: 3.5
      uncertainty_max: 0.02
      rr_min: 0.9
      trend_strength_min: 0.05
      ev_min: 0.0
      high_vol_conf_boost: 0.08
      cooldown_after_sl: 3
      spread_rank_max: 0.95
      latency_ms_max: 1200
      high_confidence_min: 0.62
      enforce_auc_min: false
execution:
  deposit_usd: 2000
  risk_usd: 50
  max_positions: 20
  per_trade_alloc_pct: 0.15
  total_alloc_pct: 0.6
  fees_bps: 2.0
  slippage_bps: 1.0
  exits:
    sl_atr_mult: 1.2
    tp1_atr_mult: 1.1
    tp2_atr_mult: 1.7
    tp1_fraction: 0.5
    breakeven_r: 0.8
    trailing:
      start_r: 1.0
      step_r: 0.5
    time_stop_minutes: 35
storage:
  model_registry: data/model_registry
  model_b_dataset: data/datasets/model_b_samples.csv
  commands_file: data/ui_commands.jsonl
  data_dir: data
  events_db: ./data/events.sqlite
  symbols_db: ./data/symbols.sqlite
  snapshots_dir: ./data/snapshots
  models_dir: ./data/models
  trades_db: data/trades.sqlite
model_b:
  hf_id: ibm-research/patchtst-fm-r1
  cache_dir: data/hf_cache
  device: cpu
pricing:
  price_source: mark
  timezone: UTC

modernization:
  volume_profile_bins: 24
  breakout_window: 20
  forecast_horizons: [1, 3, 5, 15]
  forecast_mc_samples: 64
  regime_volatility_threshold: 0.004
  regime_trend_threshold: 0.25

notifications:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
    send_signal: true
    send_trade_open: true
    send_trade_closed: true

ui:
  theme: dark_green
